[project]
name = "barangay"
version = "2026.4.13.1"
description = "Philippines Standard Geographic Code (PSGC) 2026 Python package, Fuzzy Search, JSON, and YAML."
authors = [{ name = "bendlikeabamboo", email = "mbalmeo32@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "philippines",
    "geography",
    "barangay",
    "region",
    "province",
    "municipality",
    "city",
    "PSGC",
    "philippine-standard-geographic-code",
    "fuzzy-search",
    "address-validation",
    "administrative-divisions",
    "geographic-data",
    "philippine-data",
    "address-matching",
]
classifiers = [
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pandas>=2.3.2,<3.0.0",
    "fastparquet>=2024.11.0,<2025.0.0",
    "rapidfuzz (>=3.14.0,<4.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "requests>=2.32.0",
    "python-dotenv>=1.2.2",
    "pip>=26.0.1",
    "click>=8.1.0,<9.0.0",
    "rich>=13.9.0,<14.0.0",
    "tornado>6.5.4",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-shadcn>=0.9.9",
    "mkdocs-badges>=0.5.2",
]

[project.urls]
homepage = "https://github.com/bendlikeabamboo/barangay"
repository = "https://github.com/bendlikeabamboo/barangay"
documentation = "https://bendlikeabamboo.github.io/barangay/"
"Bug Tracker" = "https://github.com/bendlikeabamboo/barangay/issues"

[project.scripts]
barangay = "barangay.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyyaml>=6.0.2,<7",
    "tqdm>=4.67.1,<5",
    "ipywidgets>=8.1.7,<9",
    "pyarrow>=22.0.0",
    "pre-commit>=4.5.1",
    "pandas-stubs>=2.3.3.251219",
    "types-pyyaml>=6.0.12.20250915",
    "pip-audit>=2.10.0",
    "ruff>=0.14.11",
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "ty>=0.0.17",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.7.0",
    "pandera[pandas]>=0.29.0",
    "openpyxl>=3.1.5",
    "pip>=26.1.2",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-shadcn>=0.9.9",
    "mkdocs-badges>=0.5.2",
]

[tool.ty.src]
exclude = [
    "parsers/",
    "tests/",
]

[tool.poe.tasks]
barpar = "python parsers/psgc/cli.py"
