name: Bug Report
description: Report a bug or unexpected behavior in the barangay package
labels: ["bug"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: "e.g., search('Tongmageng') returns no results when it should"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        ```python
        from barangay import search
        results = search("...")
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include stack traces if applicable.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      description: Output of `pip show barangay` or the version from pyproject.toml.
      placeholder: "e.g., 2026.4.13.4"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      description: Your Python version.
      placeholder: "e.g., 3.13.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any additional context (OS, virtual environment, etc.).
      placeholder: "OS: Ubuntu 24.04, uv v0.x.x"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this consistently.
          required: false
