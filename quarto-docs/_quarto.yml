      - text: Home
        href: index.qmd
      - text: Get Started
        href: get-started/index.qmd
      - text: Learn
        href: learn/index.qmd
      - text: How-To
        href: how-to/index.qmd
      - text: Reference
        href: reference/index.qmd
      - text: Plugins
        href: plugins/index.qmd
      - text: Community
        href: community/index.qmd

