<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="url(#accent)"/>

  <text x="80" y="150" fill="#f8fafc" font-size="34" font-weight="700" letter-spacing="2">PHILIPPINES · PSGC</text>
  <text x="78" y="270" fill="#ffffff" font-size="104" font-weight="800">barangay</text>
  <text x="80" y="345" fill="#fcd34d" font-size="40" font-weight="600">42,010 barangays · offline · fuzzy search</text>

  <text x="80" y="430" fill="#cbd5e1" font-size="30">All municipalities, cities, provinces &amp; regions — no API calls.</text>

  <rect x="80" y="470" rx="14" ry="14" width="560" height="74" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="110" y="517" fill="#34d399" font-size="34" font-family="monospace">$ pip install barangay</text>

  <text x="80" y="600" fill="#94a3b8" font-size="26">Philippine Standard Geographic Code — Python 3.13+</text>
